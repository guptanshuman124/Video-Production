# Product defaults. Override per machine in config/local.yaml (git-ignored) or
# per run with --config <file>. Secrets never live here — they come from env:
#   OPENAI_API_KEY, SARVAM_API_KEY, GOOGLE_APPLICATION_CREDENTIALS, ELEVENLABS_API_KEY

curriculum:
  board: cbse
  lectures_per_chapter: 5
  lecture_minutes: 20          # target; each lecture may drift within the band below
  lecture_minutes_band: [15, 25]
  slide_minutes: [1.6, 2]      # screen time per slide (Hinglish narration + transitions), for the slide budget

duration:                      # textbook lectures: video length follows the source
  base_minutes: 5.3            # minutes = base + words/1000 × per_1000, clamped to [min, max]
  minutes_per_1000_words: 7.35 # ≈ 640 words → 10 min · 1,180 → 14 min · 2,000 → 20 min
  min_minutes: 8
  max_minutes: 25              # longer sources are summarised to fit, never padded
  band: 0.3                    # the voiced lecture may land ±30% around its target (A1 gate)

language:
  slides: english              # on-screen text and all internal content
  voice: hinglish              # the only language that is voiced

narration:
  mode: direct                 # direct: narrator writes Hinglish with markers (one LLM step)
                               # via-english: English draft, then a Hinglish conversion step (~25-30% more LLM cost)
  hinglish_word_factor: 1.1    # Hinglish runs ~10% longer than English for the same content;
                               # scales each slide type's narrationWords range

llm:
  provider: openai
  # Quality first (2026-09-29): gpt-6-sol plans, writes and narrates (~$0.15/lecture);
  # gpt-6-astra, OpenAI's top model, is the fact reviewer and checks every generated picture
  # (~$0.15–0.40/lecture depending on repair rounds). The cheaper 2026-09-27 setup was
  # model gpt-6-luna + review gpt-6-sol (~$0.03/lecture) — switch back here if cost matters more.
  model: gpt-6-sol
  models:
    review: gpt-6-astra
  reasoning_effort: low        # current OpenAI models take reasoning effort, not temperature
  efforts:                     # per-task override of reasoning_effort
    review: medium
  temperature: null            # only sent when set (older models)
  timeout_s: 300
  retries: 3
  repair_attempts: 2           # LLM repair passes per failing unit before human review
  review_repair_rounds: 2      # reviewer findings: rewrite the flagged slides and review again (each review can surface new points)
  batch_size: 4                # slides per call for the writer, narrator and Hinglish layers
  concurrency: 4               # parallel LLM calls
  cache: true
  prices:                      # USD per 1M tokens (developers.openai.com/api/docs/pricing, 2026-09-27); logged per call
    gpt-6-astra:  { input: 10.00, cached_input: 1.00, output: 50.00 }   # cached rate assumed at 10%, as for sol/luna
    gpt-6-sol:    { input: 2.00, cached_input: 0.20, output: 10.00 }
    gpt-6-luna:   { input: 0.10, cached_input: 0.01, output: 0.50 }
    gpt-5.6-luna: { input: 0.20, cached_input: 0.02, output: 1.20 }
    gpt-5.4-mini: { input: 0.75, cached_input: 0.075, output: 4.50 }
    gpt-5-mini:   { input: 0.25, cached_input: 0.025, output: 2.00 }

tts:
  # Voice: Google Gemini-TTS (gemini-2.5-pro-tts), voice Aoede, steered by a teacher-style prompt
  # (2026-10-01). Chosen over Chirp 3 HD Aoede/Schedar/Sulafat because it sounds like a teacher, not a
  # reader: in a side-by-side test on a real Hinglish lesson it scored highest overall, kept English
  # terms clear (13/14 in an automatic transcript) and paused most naturally from the prompt alone.
  # hi-IN reads the mixed Devanagari + English script; English words come out in Indian English.
  # Price ≈ Chirp: $20 per 1M audio tokens (25/s) → ≈ ₹45–50 for a 20-minute lecture.
  # Samples: Videos/Prepzy Lectures/Voice samples/. Chirp 3 HD: drop `model`, voice hi-IN-Chirp3-HD-<name>.
  provider: google             # google | sarvam | elevenlabs
  strategy: auto               # auto | segments | marks  (auto: marks when the provider returns them)
  gap_ms: 200                  # silence between marker segments
  concurrency: 6               # parallel TTS requests per lecture; Gemini-TTS is ~15–20 s a request, quota 125/min (429s are retried)
  retries: 6                   # transient failures retried with backoff (honours Retry-After)
  cache: true
  loudness_lufs: -16
  sarvam:
    model: bulbul:v3           # 'shubh' is a v3 voice (v2 rejects it)
    speaker: shubh
    pace: 0.9
    sample_rate: 24000
    language: hi-IN
    max_chars: 2400            # API limit is 2,500 characters per request
  google:
    model: gemini-2.5-pro-tts  # Gemini-TTS; omit for Chirp 3 HD / Neural2 voices
    voice: Aoede               # female; Gemini voices use the bare name (Chirp: hi-IN-Chirp3-HD-Aoede)
    language: hi-IN            # Hindi voice that also speaks the English terms (no separate "Hinglish" locale exists)
    prompt: >-
      Read this as a warm, lively Indian school teacher explaining a science lesson to a class
      of students in Hinglish. Sound engaging and encouraging, as if you are talking to the class:
      stress the key ideas and technical terms, vary your intonation naturally, and take short
      natural pauses between ideas. Pronounce the English words clearly with a neutral Indian
      English accent. Keep a moderate, steady pace.
    speaking_rate: 1.03        # 1.15 felt a bit fast in a real lecture; the user asked for 10% slower (2026-10-01)
    sample_rate: 24000
    # Breathing room (2026-10-01, measured against Sarvam on the same passage): plain Chirp leaves
    # ~0.07 s at commas, so it runs on; [pause short] (~0.3 s) at commas, dashes and sentence ends
    # gives Sarvam's rhythm (21 vs 22 mid-length pauses). none | short | medium (~1.2 s) | long
    # With Gemini the prompt gives natural pauses on its own (most mid-length pauses in the test);
    # inline tags are optional. For Chirp 3 HD use short at all three (it otherwise runs on).
    pauses: { comma: none, dash: none, sentence: none }
    gap_ms: 450                # silence where a slide reveals its next point (default 200)
  elevenlabs:
    voice_id: null
    model: null

# Per-video cost shown in the dashboard (Details tab). OpenAI calls are logged in USD and
# converted at usd_inr; the voice is priced from the characters actually sent to the TTS engine.
costs:
  usd_inr: 96.1                # update when the rate moves (2026-09-30)
  gemini_tts:                  # Gemini-TTS: USD per 1M tokens (text in, audio out; 25 audio tokens per second)
    gemini-2.5-pro-tts: { text: 1.00, audio: 20.00 }
    gemini-2.5-flash-tts: { text: 0.50, audio: 10.00 }
  tts_inr_per_10k_chars:       # list prices, per voice engine (character-billed voices)
    google: 28.83              # Chirp 3 HD: $30 per 1M characters at usd_inr
    sarvam: 30                 # bulbul:v3

# Pictures for 'illustration' slides (real-life scenes; never diagrams — those stay NCERT figures).
# Drawn by the image model in one house style, then checked by a vision model (llm.models.review):
# any text, mismatch, misleading or distorted detail rejects it (one redraw, then a text-only layout).
art:
  enabled: true
  model: gpt-image-2.5-sunburst  # top quality; gpt-image-2.5-flare is the faster twin at the same price
  quality: high
  size: 1536x1024
  attempts: 2                  # draws per picture before falling back to the text-only layout
  concurrency: 2
  max_per_lecture: 2           # ≈ $0.20 per picture at high quality
  prices: { text_input: 5.00, image_output: 30.00 }   # USD per 1M tokens, for the cost log

images:
  enhance:                     # NCERT figures: Lanczos resample + light sharpening (never redrawn)
    enabled: true
    min_side: 1400             # figures whose long side is already this big are left as they are
    target: 1800               # long side after resampling (wide figures span up to 1,752 px on the slide)
    max_scale: 3

timing:                         # ms, shared by the audio track and slide cues
  transition: 800
  transition_style: soft       # stage/transitions.js
  settle: 900                  # after the slide's entrance, before narration starts
  tail: 1800                   # after narration, for exits and breathing room
  reveal_lead: 250             # a block appears this long before it is spoken

video:
  width: 1920
  height: 1080
  fps: 25
  crf: 20
  preset: medium
  tune: stillimage
  capture: jpeg
  jobs: 4
  # x264 memory: on auto it starts ~1.5 threads per core (~800 MB per encoder on 12 cores), and a
  # worker encodes one chunk per capture job at once — 2 × auto OOM-killed the 2.5 GiB worker pod
  # (2026-09-29). 3 threads + 15-frame lookahead: ~1.3 GiB for the whole render, same speed
  # (capture is the bottleneck).
  encode_threads: 3
  lookahead: 15

paths:
  jobs: jobs                   # per-stage outputs: jobs/<chapter>/<lecture>/<stage>.json
